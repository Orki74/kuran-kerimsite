<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kur'ân-ı Kerîm | Arapça & Diyanet Türkçe Okunuşu</title>
  
  <!-- Hat Sanatı ve Okuma Fontları -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-body: #f8f6f0;
      --card-bg: #ffffff;
      --sidebar-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --arabic-color: #064e3b;
      --pronun-color: #92400e;
      --pronun-bg: #fefce8;
      --accent-green: #0d5c46;
      --accent-gold: #c59b27;
      --gold-light: #fef3c7;
      --border-color: #e6dfd5;
      --card-shadow: 0 4px 20px -2px rgba(13, 92, 70, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
      --font-arabic-size: 30px;
      --font-tr-size: 16px;
    }

    /* Gece Modu (Dark Theme) */
    body.dark-mode {
      --bg-body: #0b1413;
      --card-bg: #132220;
      --sidebar-bg: #0f1c1a;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --arabic-color: #34d399;
      --pronun-color: #fde047;
      --pronun-bg: rgba(253, 224, 71, 0.08);
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --gold-light: #2d2613;
      --border-color: #1e3632;
      --card-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
    }

    /* Parşömen / Sıcak Kitap Modu */
    body.sepia-mode {
      --bg-body: #f4ecd8;
      --card-bg: #faf4e6;
      --sidebar-bg: #ede3cb;
      --text-main: #433422;
      --text-muted: #79664c;
      --arabic-color: #2c4c38;
      --pronun-color: #8c4b12;
      --pronun-bg: #efe1c3;
      --border-color: #dcd0b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Üst Çubuk (Header) */
    header {
      background: linear-gradient(135deg, #063d2e 0%, #0c5742 100%);
      color: #ffffff;
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      border-bottom: 3px solid var(--accent-gold);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: white;
    }

    .brand-icon {
      font-size: 30px;
      color: var(--accent-gold);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-text p {
      font-size: 12px;
      color: #93c5fd;
      color: rgba(255, 255, 255, 0.8);
    }

    .header-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(5px);
      user-select: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: var(--accent-gold);
    }

    .btn-gold {
      background: var(--accent-gold);
      color: #1a1a1a;
      font-weight: 600;
      border: none;
    }

    .btn-gold:hover {
      background: #dfb235;
      color: #000;
    }

    /* Ana Düzen (Sidebar + İçerik) */
    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex: 1;
      width: 100%;
      position: relative;
    }

    /* Sol Menü: Sureler */
    aside.sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      height: calc(100vh - 67px);
      position: sticky;
      top: 67px;
      display: flex;
      flex-direction: column;
      z-index: 50;
    }

    .sidebar-search {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-green);
    }

    .surah-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 8px;
    }

    .surah-item {
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .surah-item:hover {
      background: rgba(13, 92, 70, 0.08);
    }

    .surah-item.active {
      background: var(--accent-green);
      color: white !important;
    }

    .surah-item.active .surah-num,
    .surah-item.active .surah-item-ar,
    .surah-item.active .surah-sub {
      color: white !important;
    }

    .surah-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .surah-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-gold);
      width: 24px;
    }

    .surah-title {
      font-weight: 600;
      font-size: 14px;
    }

    .surah-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .surah-item-ar {
      font-family: 'Amiri Quran', 'Amiri', serif;
      font-size: 18px;
      color: var(--arabic-color);
    }

    /* Sağ Taraf: Ana İçerik */
    main.content-area {
      flex: 1;
      padding: 30px 40px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* Sure Başlık Kartı */
    .surah-banner {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }

    .surah-banner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent-green), var(--accent-gold), var(--accent-green));
    }

    .banner-arabic-title {
      font-family: 'Amiri Quran', 'Amiri', serif;
      font-size: 46px;
      color: var(--arabic-color);
      margin-bottom: 6px;
    }

    .banner-turkish-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }

    .banner-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .bismillah-text {
      font-family: 'Amiri Quran', 'Amiri', serif;
      font-size: 32px;
      color: var(--accent-gold);
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
    }

    /* Hızlı Filtre Barı */
    .view-toggles {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .toggle-chip {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-chip.active {
      background: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
    }

    /* Ayet Kartları */
    .verses-container {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .verse-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 26px 24px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
    }

    .verse-card:hover {
      border-color: rgba(197, 155, 39, 0.45);
    }

    .verse-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .verse-badge {
      background: var(--gold-light);
      color: var(--pronun-color);
      border: 1px solid rgba(197, 155, 39, 0.3);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .verse-actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .action-btn:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
      background: rgba(197, 155, 39, 0.08);
    }

    /* 1. ARAPÇA METİN */
    .arabic-box {
      font-family: 'Amiri Quran', 'Amiri', serif;
      font-size: var(--font-arabic-size);
      direction: rtl;
      text-align: right;
      color: var(--arabic-color);
      line-height: 2.3;
      word-spacing: 4px;
      padding: 4px 0;
    }

    /* 2. ARAPÇANIN HEMEN ALTINDAKİ TÜRKÇE OKUNUŞ (DİYANET) */
    .pronunciation-box {
      background: var(--pronun-bg);
      border-left: 4px solid var(--accent-gold);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: var(--font-tr-size);
      color: var(--pronun-color);
      font-weight: 500;
      line-height: 1.7;
    }

    .pronunciation-badge {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    /* 3. DİYANET MEALİ */
    .meaning-box {
      font-size: calc(var(--font-tr-size) - 0.5px);
      color: var(--text-main);
      line-height: 1.8;
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
    }

    .meaning-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 4px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Alt Gezinme Butonları */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 36px;
      gap: 16px;
    }

    /* Toast Mesajı */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #064e3b;
      color: white;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      border: 1px solid var(--accent-gold);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 2000;
    }
    #toast.show { opacity: 1; }

    /* Mobil Uyumluluk */
    .mobile-menu-btn { display: none; }
    
    @media (max-width: 860px) {
      aside.sidebar {
        position: fixed;
        left: -320px;
        top: 67px;
        height: calc(100vh - 67px);
        box-shadow: 5px 0 25px rgba(0,0,0,0.2);
        transition: left 0.3s ease;
      }
      aside.sidebar.open {
        left: 0;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      main.content-area {
        padding: 20px 14px;
      }
      :root {
        --font-arabic-size: 25px;
        --font-tr-size: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Üst Bar -->
  <header>
    <div class="header-content">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="btn mobile-menu-btn" id="toggleSidebarBtn">☰ Sureler</button>
        <a href="#" class="brand">
          <span class="brand-icon">☪</span>
          <div class="brand-text">
            <h1>Kur'ân-ı Kerîm</h1>
            <p>Diyanet Türkçe Okunuşu & Meali</p>
          </div>
        </a>
      </div>

      <div class="header-toolbar">
        <button class="btn" id="btnFontDec" title="Yazıyı Küçült">A-</button>
        <button class="btn" id="btnFontInc" title="Yazıyı Büyüt">A+</button>
        <button class="btn" id="btnTheme">🌙 Gece</button>
      </div>
    </div>
  </header>

  <div class="app-container">
    <!-- Sol Menü: Sure Listesi & Canlı Arama -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input type="text" id="searchInput" class="search-input" placeholder="Sure veya dua ara...">
      </div>
      <ul class="surah-list" id="surahList">
        <!-- JS ile doldurulacak -->
      </ul>
    </aside>

    <!-- Ana İçerik Alanı -->
    <main class="content-area">
      <!-- Filtreleme Butonları -->
      <div class="view-toggles">
        <button class="toggle-chip active" id="chipArabic">✓ Arapça Metin</button>
        <button class="toggle-chip active" id="chipPronun">✓ Türkçe Okunuşu</button>
        <button class="toggle-chip active" id="chipMeal">✓ Diyanet Meali</button>
      </div>

      <!-- Sure Başlık Alanı -->
      <div class="surah-banner">
        <div class="banner-arabic-title" id="bannerArabic">الفاتحة</div>
        <div class="banner-turkish-title" id="bannerTurkish">Fâtiha Sûresi</div>
        <div class="banner-meta" id="bannerMeta">
          <span>📍 Mekke-i Mükerreme</span>
          <span>📖 7 Âyet</span>
          <span>🔢 Nüzûl Sırası: 5</span>
        </div>
        <div class="bismillah-text">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>
      </div>

      <!-- Ayetler Listesi -->
      <div class="verses-container" id="versesContainer">
        <!-- JS ile oluşturulacak -->
      </div>

      <!-- Önceki / Sonraki Sayfa Butonları -->
      <div class="nav-buttons">
        <button class="btn btn-gold" id="btnPrev">← Önceki Sure</button>
        <button class="btn btn-gold" id="btnNext">Sonraki Sure →</button>
      </div>
    </main>
  </div>

  <div id="toast">Ayet kopyalandı!</div>

  <!-- Sitenin Veri Tabanı ve Çalışma Kodları -->
  <script>

      {

          { no: 1, ar: "قُلْ اَعُوذُ بِرَبِّ النَّاسِۙ", okunus: "Kul e'ûzü birabbinnâs.", meal: "De ki: Sığınırım insanların Rabbine," },
          { no: 2, ar: "مَلِكِ النَّاسِۙ", okunus: "Melikinnâs.", meal: "İnsanların Melikine (yegâne hükümdarına)," },
          { no: 3, ar: "اِلٰهِ النَّاسِۙ", okunus: "İlâhinnâs.", meal: "İnsanların İlâhına;" },
          { no: 4, ar: "مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِۙ", okunus: "Min şerril vesvâsil hannâs.", meal: "O sinsi vesvesecinin şerrinden." },
          { no: 5, ar: "اَلَّذ۪ي يُوَسْوِسُ ف۪ي صُدُورِ النَّاسِۙ", okunus: "Ellezî yüvesvisü fî sudûrinnâs.", meal: "O ki insanların kalplerine sürekli vesvese fısıldar." },
          { no: 6, ar: "مِنَ الْجِنَّةِ وَالنَّاسِ", okunus: "Minel cinneti vennâs.", meal: "Gerek cinlerden gerek insanlardan olan vesvesecilerin şerrinden." }
        ]
      }
    ];

    let currentIndex = 0;
    let showArabic = true;
    let showPronun = true;
    let showMeal = true;
    let currentAudio = null;

    // Element Seçimleri
    const surahListEl = document.getElementById("surahList");
    const bannerArabic = document.getElementById("bannerArabic");
    const bannerTurkish = document.getElementById("bannerTurkish");
    const bannerMeta = document.getElementById("bannerMeta");
    const versesContainer = document.getElementById("versesContainer");
    const searchInput = document.getElementById("searchInput");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const toast = document.getElementById("toast");
    const sidebar = document.getElementById("sidebar");

    // Sol Listeyi Çiz
    function renderSidebar(filteredData = database) {
      surahListEl.innerHTML = "";
      filteredData.forEach((item) => {
        const li = document.createElement("li");
        const realIdx = database.findIndex(d => d.id === item.id);
        li.className = `surah-item ${realIdx === currentIndex ? 'active' : ''}`;
        li.innerHTML = `
          <div class="surah-left">
            <span class="surah-num">${item.id}</span>
            <div>
              <div class="surah-title">${item.nameTr}</div>
              <div class="surah-sub">${item.versesCount} Âyet • ${item.place}</div>
            </div>
          </div>
          <div class="surah-item-ar">${item.nameAr}</div>
        `;
        li.onclick = () => {
          renderSurah(realIdx);
          if (window.innerWidth <= 860) sidebar.classList.remove("open");
        };
        surahListEl.appendChild(li);
      });
    }

    // Sure İçeriğini Yükle
    function renderSurah(idx) {
      currentIndex = idx;
      const s = database[idx];

      bannerArabic.textContent = s.nameAr;
      bannerTurkish.textContent = s.nameTr;
      bannerMeta.innerHTML = `
        <span>📍 ${s.place}</span>
        <span>📖 ${s.versesCount} Âyet</span>
        <span>🔢 Nüzûl: ${s.nuzul}</span>
      `;

      versesContainer.innerHTML = "";

      s.verses.forEach((v) => {
        const card = document.createElement("div");
        card.className = "verse-card";

        // Tilavet CDN adresi
        const sFormatted = String(s.id).padStart(3, '0');
        const aFormatted = String(v.no).padStart(3, '0');
        const audioUrl = `https://everyayah.com/data/Alafasy_128kbps/${sFormatted}${aFormatted}.mp3`;

        card.innerHTML = `
          <div class="verse-header">
            <span class="verse-badge">Âyet ${v.no}</span>
            <div class="verse-actions">
              <button class="action-btn" onclick="playAyah('${audioUrl}', this)">🔊 Dinle</button>
              <button class="action-btn" onclick="copyAyah('${v.okunus}', '${v.meal}')">📋 Kopyala</button>
            </div>
          </div>

          <!-- 1. Arapça -->
          <div class="arabic-box" style="display: ${showArabic ? 'block' : 'none'}">${v.ar}</div>

          <!-- 2. Arapçanın Hemen Altında Türkçe Okunuş -->
          <div class="pronunciation-box" style="display: ${showPronun ? 'block' : 'none'}">
            <span class="pronunciation-badge">Türkçe Okunuşu (Diyanet)</span>
            <div>${v.okunus}</div>
          </div>

          <!-- 3. Diyanet Meali -->
          <div class="meaning-box" style="display: ${showMeal ? 'block' : 'none'}">
            <span class="meaning-label">Diyanet Meali:</span>
            <div>${v.meal}</div>
          </div>
        `;
        versesContainer.appendChild(card);
      });

      // Menüdeki aktifliği güncelle
      document.querySelectorAll(".surah-item").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });

      // Önceki / Sonraki butonları
      btnPrev.disabled = idx === 0;
      btnPrev.style.opacity = idx === 0 ? "0.35" : "1";
      btnNext.disabled = idx === database.length - 1;
      btnNext.style.opacity = idx === database.length - 1 ? "0.35" : "1";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Ses Çalma Fonksiyonu
    window.playAyah = function(url, btn) {
      if (currentAudio) {
        currentAudio.pause();
        document.querySelectorAll('.action-btn').forEach(b => {
          if (b.innerText.includes('Durdur')) b.innerHTML = '🔊 Dinle';
        });
      }

      const audio = new Audio(url);
      currentAudio = audio;
      btn.innerHTML = '⏸ Durdur';

      audio.play().catch(() => {
        showToastMsg("Ses çalınamadı (İnternet bağlantınızı kontrol edin).");
        btn.innerHTML = '🔊 Dinle';
      });

      audio.onended = () => {
        btn.innerHTML = '🔊 Dinle';
      };
    };

    // Ayet Kopyalama
    window.copyAyah = function(okunus, meal) {
      const text = `${okunus}\n\nMeali: ${meal}`;
      navigator.clipboard.writeText(text).then(() => {
        showToastMsg("Ayet ve okunuşu kopyalandı!");
      });
    };

    function showToastMsg(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2400);
    }

    // Arama Çubuğu Canlı Filtreleme
    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = database.filter(item => 
        item.nameTr.toLowerCase().includes(q) || 
        item.id.toString() === q
      );
      renderSidebar(filtered);
    });

    // İleri / Geri Butonları
    btnPrev.addEventListener("click", () => {
      if (currentIndex > 0) renderSurah(currentIndex - 1);
    });
    btnNext.addEventListener("click", () => {
      if (currentIndex < database.length - 1) renderSurah(currentIndex + 1);
    });

    // Göster / Gizle Filtre Çipleri
    document.getElementById("chipArabic").addEventListener("click", function() {
      showArabic = !showArabic;
      this.classList.toggle("active", showArabic);
      document.querySelectorAll(".arabic-box").forEach(el => el.style.display = showArabic ? "block" : "none");
    });
    document.getElementById("chipPronun").addEventListener("click", function() {
      showPronun = !showPronun;
      this.classList.toggle("active", showPronun);
      document.querySelectorAll(".pronunciation-box").forEach(el => el.style.display = showPronun ? "block" : "none");
    });
    document.getElementById("chipMeal").addEventListener("click", function() {
      showMeal = !showMeal;
      this.classList.toggle("active", showMeal);
      document.querySelectorAll(".meaning-box").forEach(el => el.style.display = showMeal ? "block" : "none");
    });

    // Yazı Boyutu Değiştirme
    let arabicFontSize = 30;
    document.getElementById("btnFontInc").addEventListener("click", () => {
      if (arabicFontSize < 46) {
        arabicFontSize += 2;
        document.documentElement.style.setProperty('--font-arabic-size', arabicFontSize + 'px');
      }
    });
    document.getElementById("btnFontDec").addEventListener("click", () => {
      if (arabicFontSize > 22) {
        arabicFontSize -= 2;
        document.documentElement.style.setProperty('--font-arabic-size', arabicFontSize + 'px');
      }
    });

    // Tema Değiştirme (Aydınlık -> Gece -> Parşömen)
    const themes = ["light", "dark", "sepia"];
    let currentThemeIdx = 0;
    const btnTheme = document.getElementById("btnTheme");

    btnTheme.addEventListener("click", () => {
      document.body.classList.remove("dark-mode", "sepia-mode");
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;

      if (themes[currentThemeIdx] === "dark") {
        document.body.classList.add("dark-mode");
        btnTheme.textContent = "📜 Parşömen";
      } else if (themes[currentThemeIdx] === "sepia") {
        document.body.classList.add("sepia-mode");
        btnTheme.textContent = "☀️ Aydınlık";
      } else {
        btnTheme.textContent = "🌙 Gece";
      }
    });

    // Mobil Menü Aç/Kapa
    document.getElementById("toggleSidebarBtn").addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    // Başlangıç Yüklemesi
    renderSidebar();
    renderSurah(0);
  </script>
</body>
</html>
